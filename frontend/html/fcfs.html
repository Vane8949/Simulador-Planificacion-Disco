<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCFS - Simulador</title>
    <link rel="stylesheet" href="../css/style.css">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    <!-- Botón para volver al menú -->
    <a href="index.html" style="display:inline-block; margin-bottom: 20px; color: #1e3a8a; text-decoration: none; font-weight: bold;">
        <i class="fas fa-arrow-left"></i> Volver al Menú
    </a>

    <header class="main-header" style="background-color: #2d88eb; color: white;">
        <div class="header-content">
            <div class="header-text">
                <h1 style="color: white;">FCFS (First Come, First Served)</h1>
                <p style="color: #e2eafc;">Atiende las solicitudes exactamente en el orden en que fueron recibidas.</p>
            </div>
        </div>
    </header>

    <!-- ESTO LE DICE A JS QUE SOLO SIMULE FCFS -->
    <input type="hidden" id="fixed-algorithm" value="FCFS">

    <div class="dashboard-layout">
        <!-- Columna Izquierda: Configuración -->
        <aside class="sidebar">
            <div class="panel config-panel">
                <div class="panel-header gray-header">
                    <h2><i class="fas fa-cog"></i> Configuración</h2>
                </div>
                <form id="simulation-form" class="panel-body">
                    <div class="form-group">
                        <label for="cylinders">Número de Cilindros:</label>
                        <input type="number" id="cylinders" value="200" min="10" required>
                    </div>
                    <div class="form-group">
                        <label for="initialPos">Posición Inicial del Cabezal:</label>
                        <input type="number" id="initialPos" value="53" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="requests">Solicitudes (separadas por coma):</label>
                        <input type="text" id="requests" value="98, 183, 37, 122, 14, 124, 65, 67" required>
                    </div>
                    <div class="form-group">
                        <label for="timePerCylinder">Tiempo por Movimiento (ms):</label>
                        <input type="number" id="timePerCylinder" value="2" min="0.1" step="0.1" required>
                    </div>
                    <button type="submit" id="btn-simulate" style="background-color: #2d88eb;"><i class="fas fa-play"></i> Simular FCFS</button>
                </form>
            </div>
        </aside>

        <!-- Columna Derecha: Simulación -->
        <main class="main-content">
            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fas fa-chart-line"></i> Gráfica de Rendimiento</h2>
                </div>
                <div class="panel-body">
                    <div class="simulation-toolbar">
                        <div class="legend">
                            <span class="leg-item"><span class="dot" style="background-color: #2d88eb;"></span> Trayectoria (FCFS)</span>
                        </div>
                        <div class="controls-wrapper">
                            <button id="btn-play" class="btn-icon"><i class="fas fa-play"></i></button>
                            <button id="btn-pause" class="btn-icon"><i class="fas fa-pause"></i></button>
                            <button id="btn-reset" class="btn-icon"><i class="fas fa-redo"></i></button>
                        </div>
                    </div>
                    <div class="canvas-container">
                        <canvas id="diskCanvas" width="900" height="150"></canvas>
                    </div>
                </div>
            </div>

            <!-- Tabla de Resultados -->
            <div class="panel">
                <div class="panel-body">
                    <table id="results-table">
                        <thead>
                            <tr>
                                <th>Algoritmo</th>
                                <th>Recorrido Total</th>
                                <th>Tiempo Total (ms)</th>
                                <th>Tiempo Prom. Búsqueda</th>
                                <th>Tiempo Prom. Espera</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
